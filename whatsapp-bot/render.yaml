services:
  - type: web
    name: ecoloop-whatsapp-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: WHATSAPP_VERIFY_TOKEN
        value: ecoloop_mission_verify_token_2026
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: BASE_URL
        sync: false
      - key: CAMPUS_NAME
        value: "Nitte Deemed to be University"
